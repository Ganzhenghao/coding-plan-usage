<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodingPlan 用量查询</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>CodingPlan 用量</h1>
      <div class="header-actions">
        <button id="settingsBtn" class="header-btn" title="设置">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.611 3.611 0 0112 15.6z"/>
          </svg>
        </button>
        <button id="refreshBtn" class="header-btn" title="刷新">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="glm">GLM</button>
      <button class="tab" data-tab="minimax">Minimax</button>
    </div>

    <!-- GLM 面板 -->
    <div id="glmPanel" class="panel active">
      <div id="glmLogin" class="login-prompt" style="display:none">
        <p>请先登录智谱 GLM</p>
        <button id="glmLoginBtn" class="primary-btn">前往登录</button>
      </div>
      <div id="glmSkeleton" class="content">
        <div class="usage-card">
          <div class="skeleton-line w60"></div>
          <div class="skeleton-bar"></div>
          <div class="skeleton-line w40"></div>
        </div>
        <div class="usage-card">
          <div class="skeleton-line w60"></div>
          <div class="skeleton-bar"></div>
          <div class="skeleton-line w80"></div>
        </div>
      </div>
      <div id="glmContent" class="content" style="display:none">
        <div class="usage-card">
          <div class="usage-header">
            <span class="usage-label">Tokens</span>
            <span id="glmTokensPercent" class="usage-percent">--</span>
          </div>
          <div class="progress-bar">
            <div id="glmTokensProgress" class="progress-fill"></div>
          </div>
          <div class="usage-detail">
            <span id="glmTokensUsage">--</span>
            <span id="glmTokensTime" class="update-time">--</span>
          </div>
        </div>
        <div class="usage-card">
          <div class="usage-header">
            <span class="usage-label">MCP工具调用</span>
            <span id="glmToolsPercent" class="usage-percent">--</span>
          </div>
          <div class="progress-bar">
            <div id="glmToolsProgress" class="progress-fill"></div>
          </div>
          <div class="usage-detail">
            <span id="glmToolsUsage">--</span>
            <span id="glmToolsTime" class="update-time">--</span>
          </div>
          <div id="glmToolsDetails" class="tools-details"></div>
        </div>
        <button id="glmGoUsageBtn" class="go-usage-btn">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path fill="currentColor" d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
          查看详细用量
        </button>
      </div>
      <div id="glmError" class="error-prompt" style="display:none">
        <p id="glmErrorMsg"></p>
        <button id="glmErrorBtn" class="primary-btn"></button>
      </div>
    </div>

    <!-- MiniMax 面板 -->
    <div id="minimaxPanel" class="panel">
      <!-- 未配置 Key 提示 -->
      <div id="minimaxNoKey" class="login-prompt" style="display:none">
        <p>Minimax API Key 未配置</p>
        <button id="minimaxGoSettingsBtn" class="primary-btn">前往设置</button>
      </div>
      <div id="minimaxSkeleton" class="content" style="display:none">
        <div class="usage-card">
          <div class="skeleton-line w60"></div>
          <div class="skeleton-bar"></div>
          <div class="skeleton-line w40"></div>
        </div>
        <div class="usage-card">
          <div class="skeleton-line w60"></div>
          <div class="skeleton-bar"></div>
          <div class="skeleton-line w40"></div>
        </div>
      </div>
      <div id="minimaxContent" class="content" style="display:none">
        <div id="minimaxCards" class="cards-grid"></div>
        <button id="minimaxGoUsageBtn" class="go-usage-btn">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path fill="currentColor" d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
          查看详细用量
        </button>
      </div>
      <div id="minimaxError" class="error-prompt" style="display:none">
        <p id="minimaxErrorMsg"></p>
        <button id="minimaxErrorBtn" class="primary-btn"></button>
      </div>
    </div>

    <!-- 全局错误消息 -->
    <div id="errorMsg" class="error-msg" style="display:none"></div>
  </div>

  <!-- 设置面板 -->
  <div id="settingsOverlay" class="settings-overlay">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>设置</h2>
        <button id="settingsCloseBtn" class="header-btn" title="关闭">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <!-- MiniMax API Key -->
        <div class="settings-group">
          <div class="settings-label">Minimax API Key</div>
          <input type="password" id="apiKeyInput" placeholder="sk-cp-xxxxxxxx" class="api-input">
          <div class="settings-btn-row">
            <button id="autoGetBtn" class="secondary-btn">自动获取</button>
            <button id="saveApiKeyBtn" class="primary-btn">保存</button>
          </div>
          <p id="apiKeyHint" class="settings-hint"></p>
        </div>
        <!-- 自动刷新 -->
        <div class="settings-group">
          <div class="settings-label">自动刷新</div>
          <div class="settings-row">
            <span class="settings-desc">打开弹窗时自动定时刷新数据</span>
            <label class="toggle">
              <input type="checkbox" id="autoRefreshToggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div id="autoRefreshOptions" class="settings-sub" style="display:none">
            <div class="settings-row">
              <span class="settings-desc">刷新间隔</span>
              <select id="autoRefreshInterval" class="settings-select">
                <option value="60">1 分钟</option>
                <option value="180">3 分钟</option>
                <option value="300" selected>5 分钟</option>
                <option value="600">10 分钟</option>
              </select>
            </div>
            <div class="settings-row" style="margin-top:12px">
              <span class="settings-desc">用量预警提醒</span>
              <label class="toggle">
                <input type="checkbox" id="alertToggle">
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div id="alertOptions" class="alert-options" style="display:none">
              <div class="threshold-row">
                <span class="settings-desc">阈值 1</span>
                <div class="threshold-input-wrap">
                  <input type="number" id="alertThreshold1" class="threshold-input" min="1" max="99" value="50">
                  <span class="threshold-suffix">%</span>
                </div>
              </div>
              <div class="threshold-row">
                <span class="settings-desc">阈值 2</span>
                <div class="threshold-input-wrap">
                  <input type="number" id="alertThreshold2" class="threshold-input" min="1" max="99" value="80">
                  <span class="threshold-suffix">%</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
